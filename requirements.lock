# Fully pinned runtime dependencies for reproducible Docker builds.
#
# Regenerate after an intentional upgrade:
#   .venv/bin/python -m pip install -U -r requirements.txt
#   .venv/bin/python -m pip freeze > requirements.lock
# and rebuild the image, so the lock matches what you actually tested.
#
# Note: no --hash pins. Hashes are platform-specific (macOS arm64 vs
# linux/amd64 inside the image), so hash pinning here would break the
# Docker build. Exact version pins are what make the build reproducible.

